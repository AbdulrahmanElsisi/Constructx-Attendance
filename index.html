<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ConstructX Daily Attendance Check-In — Secure QR-based attendance with device fingerprinting">
    <title>ConstructX — Daily Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FingerprintJS for device identification -->
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@4/dist/fp.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-particles" aria-hidden="true">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <main class="container">
        <div class="card" id="attendance-card">
            <!-- Header -->
            <div class="card-header">
                <div class="logo-mark">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <rect x="4" y="4" width="14" height="14" rx="3" fill="currentColor" opacity="0.9"/>
                        <rect x="22" y="4" width="14" height="14" rx="3" fill="currentColor" opacity="0.6"/>
                        <rect x="4" y="22" width="14" height="14" rx="3" fill="currentColor" opacity="0.6"/>
                        <rect x="22" y="22" width="14" height="14" rx="3" fill="currentColor" opacity="0.3"/>
                    </svg>
                </div>
                <h1 id="page-title">ConstructX</h1>
                <p class="subtitle">Daily Attendance Check-In</p>
            </div>

            <!-- Loading State -->
            <div class="state-section" id="state-loading">
                <div class="spinner-container">
                    <div class="spinner"></div>
                </div>
                <p class="state-message">Verifying your device…</p>
            </div>

            <!-- Already Checked In State -->
            <div class="state-section hidden" id="state-checked-in">
                <div class="status-icon success-icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="3" opacity="0.2"/>
                        <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="3" stroke-dasharray="138" stroke-dashoffset="0" class="circle-animate"/>
                        <path d="M15 24L21 30L33 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="check-animate"/>
                    </svg>
                </div>
                <p class="state-message" id="already-checked-message">You have already checked in for today</p>
                <span class="date-badge" id="checked-date-badge"></span>
            </div>

            <!-- Check-in Form State -->
            <div class="state-section hidden" id="state-form">
                <div class="date-display">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <rect x="2" y="3" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M2 7H16" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M6 1V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M12 1V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span id="current-date-display"></span>
                </div>

                <form id="attendance-form" autocomplete="off">
                    <div class="input-group">
                        <label for="attendee-name">Full Name</label>
                        <input
                            type="text"
                            id="attendee-name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                            minlength="2"
                            maxlength="100"
                            autofocus
                        />
                    </div>
                    <button type="submit" id="submit-btn" class="btn-primary">
                        <span class="btn-text">Check In</span>
                        <span class="btn-loading hidden">
                            <svg class="btn-spinner" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2.5" opacity="0.25"/>
                                <path d="M18 10C18 5.58 14.42 2 10 2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            </svg>
                            Submitting…
                        </span>
                    </button>
                </form>
            </div>

            <!-- Success State (after submission) -->
            <div class="state-section hidden" id="state-success">
                <div class="status-icon success-icon pop-in">
                    <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                        <circle cx="28" cy="28" r="26" stroke="currentColor" stroke-width="3" opacity="0.2"/>
                        <circle cx="28" cy="28" r="26" stroke="currentColor" stroke-width="3" stroke-dasharray="163" stroke-dashoffset="0" class="circle-animate"/>
                        <path d="M17 28L24 35L39 20" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="check-animate"/>
                    </svg>
                </div>
                <h2 class="success-title">You're Checked In!</h2>
                <p class="state-message" id="success-name-message"></p>
                <span class="date-badge" id="success-date-badge"></span>
            </div>

            <!-- Error State -->
            <div class="state-section hidden" id="state-error">
                <div class="status-icon error-icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="3" opacity="0.2"/>
                        <path d="M17 17L31 31M31 17L17 31" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </div>
                <p class="state-message error-message" id="error-message">Something went wrong. Please try again.</p>
                <button class="btn-secondary" id="retry-btn" onclick="location.reload()">Try Again</button>
            </div>
        </div>

        <footer class="footer">
            <p>Secured with device fingerprinting · <span id="footer-date"></span></p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>

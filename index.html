<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConstructX - Dynamic QR Generator</title>
    
    <!-- Tailwind CSS v3 via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QRCode.js for generating QR codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        teal: {
                            primary: '#0A6062',
                            deep: '#074547',
                            light: '#EDF5F5',
                        },
                        gold: {
                            accent: '#A78231'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .progress-bar {
            transition: width 1s linear;
        }
    </style>
</head>
<body class="bg-teal-deep text-white min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Password Overlay -->
    <div id="password-overlay" class="fixed inset-0 z-50 bg-teal-deep flex flex-col items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-white/5 border border-white/10 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
            <img src="ConstructX Logo Transparent.png" alt="ConstructX" class="w-40 mx-auto mb-6">
            <h2 class="text-xl font-bold text-white mb-6">Admin Access</h2>
            <form id="password-form" class="space-y-4">
                <input type="password" id="admin-password" placeholder="Enter password" required autofocus
                    class="w-full px-4 py-3 rounded-xl bg-black/20 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-gold-accent focus:ring-1 focus:ring-gold-accent">
                <p id="password-error" class="text-red-400 text-sm hidden">Incorrect password</p>
                <button type="submit" class="w-full bg-gold-accent hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-xl transition">
                    Unlock Generator
                </button>
            </form>
        </div>
    </div>

    <!-- Background Decor -->
    <div class="absolute inset-0 pointer-events-none opacity-20">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-teal-primary blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-gold-accent blur-[120px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-md bg-white/5 border border-white/10 backdrop-blur-xl rounded-3xl p-8 shadow-2xl flex flex-col items-center text-center">
        
        <div class="mb-8">
            <img src="ConstructX Logo Transparent.png" alt="ConstructX" class="w-48 mx-auto mb-4">
            <p class="text-gray-400 mt-2 font-medium">Scan to record attendance</p>
        </div>

        <!-- QR Code Container -->
        <div class="bg-white p-4 rounded-2xl shadow-inner mb-8">
            <div id="qrcode" class="w-64 h-64 flex items-center justify-center"></div>
        </div>

        <!-- Timer -->
        <div class="w-full space-y-3">
            <div class="flex justify-between text-sm text-gray-400 font-medium px-1">
                <span>Refreshing in</span>
                <span id="timer-text" class="text-gold-accent font-bold">10s</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-teal-primary to-gold-accent h-2 rounded-full progress-bar w-full"></div>
            </div>
        </div>
        
        <p class="text-xs text-gray-500 mt-6 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            Dynamic Secure QR
        </p>

    </div>

    <script>
        const REFRESH_INTERVAL = 10; // seconds
        let secondsLeft = REFRESH_INTERVAL;
        let qrCodeInstance = null;

        // Construct the attendance URL (Assumes attendance.html is in the same directory)
        const getBaseUrl = () => {
            const currentUrl = window.location.href;
            const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/'));
            // In a real production setup, hardcode your domain here like: 'https://mywebsite.com/attendance.html'
            return `${baseUrl}/attendance.html`;
        };

        const generateToken = () => {
            const timestamp = Date.now().toString();
            return btoa(timestamp); // Base64 encode the timestamp
        };

        const updateQRCode = () => {
            const attendanceUrl = `${getBaseUrl()}?token=${generateToken()}`;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // Clear previous

            qrCodeInstance = new QRCode(qrContainer, {
                text: attendanceUrl,
                width: 256,
                height: 256,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        };

        const startTimer = () => {
            const timerText = document.getElementById('timer-text');
            const progressBar = document.getElementById('progress-bar');

            setInterval(() => {
                secondsLeft--;
                
                timerText.textContent = `${secondsLeft}s`;
                progressBar.style.width = `${(secondsLeft / REFRESH_INTERVAL) * 100}%`;

                if (secondsLeft <= 0) {
                    updateQRCode();
                    secondsLeft = REFRESH_INTERVAL;
                    // Instantly reset progress bar visually
                    progressBar.style.transition = 'none';
                    progressBar.style.width = '100%';
                    // Restore transition after a tiny delay
                    setTimeout(() => {
                        progressBar.style.transition = 'width 1s linear';
                    }, 50);
                }
            }, 1000);
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('password-overlay');
            const form = document.getElementById('password-form');
            const input = document.getElementById('admin-password');
            const error = document.getElementById('password-error');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                try {
                    // Fetch the password dynamically so it's not visible in the HTML source
                    const response = await fetch('config.json');
                    const config = await response.json();
                    
                    if (input.value === config.admin_password) {
                        overlay.style.display = 'none';
                        updateQRCode();
                        startTimer();
                    } else {
                        error.classList.remove('hidden');
                        input.value = '';
                    }
                } catch (err) {
                    console.error("Failed to load config.json:", err);
                    alert("Error loading security configuration. If you are opening this file directly from your computer (file://), your browser might block it. You need to host it or use a local server.");
                }
            });
        });
    </script>
</body>
</html>

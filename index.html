<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConstructX - Dynamic QR Generator</title>
    
    <!-- Tailwind CSS v3 via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QRCode.js for generating QR codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                            950: '#172554',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .progress-bar {
            transition: width 1s linear;
        }
    </style>
</head>
<body class="bg-brand-950 text-white min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Background Decor -->
    <div class="absolute inset-0 pointer-events-none opacity-20">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-brand-500 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-teal-500 blur-[120px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-md bg-white/5 border border-white/10 backdrop-blur-xl rounded-3xl p-8 shadow-2xl flex flex-col items-center text-center">
        
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300">
                ConstructX
            </h1>
            <p class="text-gray-400 mt-2 font-medium">Scan to record attendance</p>
        </div>

        <!-- QR Code Container -->
        <div class="bg-white p-4 rounded-2xl shadow-inner mb-8">
            <div id="qrcode" class="w-64 h-64 flex items-center justify-center"></div>
        </div>

        <!-- Timer -->
        <div class="w-full space-y-3">
            <div class="flex justify-between text-sm text-gray-400 font-medium px-1">
                <span>Refreshing in</span>
                <span id="timer-text" class="text-blue-400 font-bold">10s</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-teal-400 h-2 rounded-full progress-bar w-full"></div>
            </div>
        </div>
        
        <p class="text-xs text-gray-500 mt-6 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            Dynamic Secure QR
        </p>

    </div>

    <script>
        const REFRESH_INTERVAL = 10; // seconds
        let secondsLeft = REFRESH_INTERVAL;
        let qrCodeInstance = null;

        // Construct the attendance URL (Assumes attendance.html is in the same directory)
        const getBaseUrl = () => {
            const currentUrl = window.location.href;
            const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/'));
            // In a real production setup, hardcode your domain here like: 'https://mywebsite.com/attendance.html'
            return `${baseUrl}/attendance.html`;
        };

        const generateToken = () => {
            const timestamp = Date.now().toString();
            return btoa(timestamp); // Base64 encode the timestamp
        };

        const updateQRCode = () => {
            const attendanceUrl = `${getBaseUrl()}?token=${generateToken()}`;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // Clear previous

            qrCodeInstance = new QRCode(qrContainer, {
                text: attendanceUrl,
                width: 256,
                height: 256,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        };

        const startTimer = () => {
            const timerText = document.getElementById('timer-text');
            const progressBar = document.getElementById('progress-bar');

            setInterval(() => {
                secondsLeft--;
                
                timerText.textContent = `${secondsLeft}s`;
                progressBar.style.width = `${(secondsLeft / REFRESH_INTERVAL) * 100}%`;

                if (secondsLeft <= 0) {
                    updateQRCode();
                    secondsLeft = REFRESH_INTERVAL;
                    // Instantly reset progress bar visually
                    progressBar.style.transition = 'none';
                    progressBar.style.width = '100%';
                    // Restore transition after a tiny delay
                    setTimeout(() => {
                        progressBar.style.transition = 'width 1s linear';
                    }, 50);
                }
            }, 1000);
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const pass = prompt('Enter admin password to access the generator:');
            if (pass !== 'ConX@YoussefYahya2026') {
                document.body.innerHTML = '<div class="flex flex-col items-center justify-center min-h-screen"><h1 class="text-4xl font-bold text-red-500 mb-4">Access Denied</h1><p class="text-gray-400">Incorrect password.</p></div>';
                return;
            }
            updateQRCode();
            startTimer();
        });
    </script>
</body>
</html>
